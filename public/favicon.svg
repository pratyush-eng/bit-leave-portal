<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bitRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="bitGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="bitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#bitRedGrad)" stroke="#f59e0b" stroke-width="4" />

  <!-- Gear spokes -->
  <g fill="#fbbf24">
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(0 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(30 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(60 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(90 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(120 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(150 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(180 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(210 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(240 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(270 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(300 100 100)" />
    <rect x="96.5" y="2" width="7" height="8" rx="1.5" transform="rotate(330 100 100)" />
  </g>

  <circle cx="100" cy="100" r="88" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3 2" />
  <circle cx="100" cy="100" r="76" fill="#ffffff" stroke="#d97706" stroke-width="2" />

  <path id="textPathTop" d="M 32 100 A 68 68 0 0 1 168 100" fill="none"/>
  <path id="textPathBottom" d="M 168 100 A 68 68 0 0 1 32 100" fill="none"/>

  <text fill="#7f1d1d" font-size="11" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" letter-spacing="1.2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">BIRLA INSTITUTE OF TECHNOLOGY</textPath>
  </text>
  <text fill="#7f1d1d" font-size="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" letter-spacing="1">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">MESRA • RANCHI • 1955</textPath>
  </text>

  <circle cx="100" cy="100" r="54" fill="url(#bitRedGrad)" stroke="#f59e0b" stroke-width="2.5" filter="url(#bitGlow)" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.6" />

  <g transform="translate(0, -2)">
    <path d="M100 52 C96 60, 94 67, 97 73 C99 77, 100 79, 100 81 C100 79, 101 77, 103 73 C106 67, 104 60, 100 52 Z" fill="url(#flameGrad)" filter="url(#bitGlow)" />
    <path d="M86 82 Q100 88 114 82 C114 89, 86 89, 86 82 Z" fill="url(#bitGoldGrad)" stroke="#b45309" stroke-width="1" />
    <ellipse cx="100" cy="82" rx="14" ry="2.5" fill="#fef08a" />
    <path d="M78 94 Q100 90 100 97 Q100 90 122 94 L122 108 Q100 104 100 111 Q100 104 78 108 Z" fill="#ffffff" stroke="#991b1b" stroke-width="1.5" />
    <path d="M100 97 L100 111" stroke="#991b1b" stroke-width="1.5" />
    <path d="M74 116 Q100 112 126 116 L123 124 Q100 120 77 124 Z" fill="url(#bitGoldGrad)" stroke="#92400e" stroke-width="1" />
  </g>
</svg>
