<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F51B5" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" />

  <g filter="url(#shadow)">
    <!-- Graduation Cap Top Diamond -->
    <path d="M64 34 L100 50 L64 66 L28 50 Z" fill="#FFFFFF" />
    <path d="M64 38 L92 50 L64 62 L36 50 Z" fill="#E8EAF6" />

    <!-- Cap Skull Base -->
    <path d="M42 57 V70 C42 77, 86 77, 86 70 V57 L64 68 Z" fill="#C5CAE9" />
    <path d="M44 59 V69 C44 74, 84 74, 84 69 V59 L64 66 Z" fill="#FFFFFF" />

    <!-- Tassel -->
    <path d="M92 51 L95 72 C93 75, 97 78, 95 82" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="95" cy="82" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Academic Book / Leaves Emblem -->
  <g filter="url(#shadow)" transform="translate(0, 12)">
    <!-- Open Book Pages -->
    <path d="M38 78 Q64 74 64 82 Q64 74 90 78 V90 Q64 86 64 94 Q64 86 38 90 Z" fill="#FFFFFF" />
    <path d="M40 80 Q64 76 64 83 Q64 76 88 80 V90 Q64 86 64 92 Q64 86 40 90 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
